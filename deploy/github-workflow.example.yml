name: Deploy to Hetzner (template for later activation)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hetzner-production
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Transfer and deploy tested release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
          DEPLOY_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.HETZNER_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]] || { echo 'Server fehlt oder ist ungueltig.'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'SSH-Nutzer fehlt oder ist ungueltig.'; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          [[ -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo 'SSH-Verbindung ist noch nicht konfiguriert.'; exit 1; }
          umask 077
          keyfile="$RUNNER_TEMP/miteinander-deploy-key"
          hostsfile="$RUNNER_TEMP/miteinander-known-hosts"
          archive="$RUNNER_TEMP/miteinander-${GITHUB_SHA}.tar.gz"
          trap 'rm -f "$keyfile" "$hostsfile"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keyfile"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hostsfile"
          git archive --format=tar HEAD | gzip > "$archive"
          digest="$(sha256sum "$archive" | cut -d ' ' -f1)"
          opts=(-i "$keyfile" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hostsfile" -o ConnectTimeout=15)
          scp "${opts[@]}" -P "$DEPLOY_PORT" "$archive" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/miteinander-${GITHUB_SHA}.tar.gz"
          ssh "${opts[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA' '$digest'" < deploy/github-release.sh
      - name: Verify public app
        env:
          APP_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          [[ "$APP_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?/?$ ]] || { echo 'PRODUCTION_URL fehlt oder ist ungueltig.'; exit 1; }
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 20 "${APP_URL%/}/api/health"
