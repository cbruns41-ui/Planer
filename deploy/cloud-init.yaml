#cloud-config
# For a NEW Ubuntu 24.04 server. Source: Docker's official Ubuntu repository.
package_update: true
packages:
  - ca-certificates
  - curl
runcmd:
  - [install, -m, "0755", -d, /etc/apt/keyrings]
  - [curl, -fsSL, https://download.docker.com/linux/ubuntu/gpg, -o, /etc/apt/keyrings/docker.asc]
  - [chmod, a+r, /etc/apt/keyrings/docker.asc]
  - |
    . /etc/os-release
    printf 'Types: deb\nURIs: https://download.docker.com/linux/ubuntu\nSuites: %s\nComponents: stable\nArchitectures: %s\nSigned-By: /etc/apt/keyrings/docker.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" > /etc/apt/sources.list.d/docker.sources
  - [apt-get, update]
  - [apt-get, install, -y, docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
  - [systemctl, enable, --now, docker]
  - [mkdir, -p, /opt/miteinander]
final_message: "Docker vorbereitet. App nach /opt/miteinander übertragen und deploy/README.md befolgen."
